<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Lost & Found</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <nav>

            <h1>College Lost & Found</h1>

            <a href="index.html">Home</a>
            <a href="report.html">Report Item</a>

        </nav>

    </header>


    <main>

        <section>

            <h2>Find What You Lost</h2>

            <p>
                Lost something on campus? Or found something that belongs
                to someone else? Use our College Lost & Found system to
                report and find items easily.
            </p>

        </section>


        <section>

            <h2>Search Items</h2>

            <form id="search-form">

                <input
                    type="text"
                    id="search-input"
                    placeholder="Search for an item"
                >

                <button type="submit" id="search-button">
                    Search
                </button>

            </form>

        </section>


        <section>

            <h2>Browse Items</h2>

            <button type="button" id="all-button">
                All
            </button>

            <button type="button" id="lost-button">
                Lost
            </button>

            <button type="button" id="found-button">
                Found
            </button>

        </section>


        <section>

            <h2>Recent Items</h2>

            <div id="items-container"></div>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 College Lost & Found</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>

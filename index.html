
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Lost & Found</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h1>College Lost & Found</h1>

            <a href="index.html">Home</a>
            <a href="report.html">Report Item</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h1>Find What's Lost. Return What's Found.</h1>

            <p>
                Lost something on campus or found an item?
                Help reunite lost belongings with their owners.
            </p>

            <a href="report.html" class="button">
                Report an Item
            </a>
        </section>

        <section class="search-section">
            <h2>Find an Item</h2>

            <form id="search-form">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search by item name, category or location"
                    aria-label="Search items"
                >

                <button type="submit" id="search-button">
                    Search
                </button>
            </form>
        </section>

        <section class="filter-section">
            <h2>Browse Items</h2>

            <div class="filter-buttons">
                <button type="button" id="all-button">
                    All Items
                </button>

                <button type="button" id="lost-button">
                    Lost Items
                </button>

                <button type="button" id="found-button">
                    Found Items
                </button>

                <button type="button" id="recovered-button">
                    Recovered Items
                </button>
            </div>
        </section>

        <section class="items-section">
            <h2>Recent Items</h2>

            <div id="items-container">
                <p>Loading items...</p>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 College Lost & Found</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>

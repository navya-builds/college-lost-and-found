<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - College Lost & Found</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <h1>College Lost & Found</h1>
            <a href="index.html">Home</a>
            <a href="report.html">Report Item</a>
            <span id="nav-auth" class="nav-auth"></span>
        </nav>
    </header>

    <main>
        <section class="auth-card">
            <h2>Create an Account</h2>

            <form id="signup-form">
                <div>
                    <label for="signup-name">Full Name</label>
                    <input
                        type="text"
                        id="signup-name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="signup-email">Email</label>
                    <input
                        type="email"
                        id="signup-email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="signup-password">Password</label>
                    <input
                        type="password"
                        id="signup-password"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <div>
                    <label for="signup-confirm">Confirm Password</label>
                    <input
                        type="password"
                        id="signup-confirm"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <p id="form-message" class="form-message" role="alert"></p>

                <button type="submit">Sign Up</button>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 College Lost & Found</p>
    </footer>

    <script src="auth.js"></script>

</body>
</html>

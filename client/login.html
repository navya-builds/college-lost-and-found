<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - College Lost & Found</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <h1>College Lost & Found</h1>
            <a href="index.html">Home</a>
            <a href="report.html">Report Item</a>
            <span id="nav-auth" class="nav-auth"></span>
        </nav>
    </header>

    <main>
        <section class="auth-card">
            <h2>Login</h2>

            <form id="login-form">
                <div>
                    <label for="login-email">Email</label>
                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="login-password">Password</label>
                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p id="form-message" class="form-message" role="alert"></p>

                <button type="submit">Login</button>
            </form>

            <p class="auth-switch">
                New here? <a href="signup.html">Create an account</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 College Lost & Found</p>
    </footer>

    <script src="auth.js"></script>

</body>
</html>

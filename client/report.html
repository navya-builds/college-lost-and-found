<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Item - College Lost & Found</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <nav>

            <h1>College Lost & Found</h1>

            <a href="index.html">Home</a>
            <a href="report.html">Report Item</a>

        </nav>

    </header>


    <main>

        <section>

            <h2>Report a Lost or Found Item</h2>

            <form id="report-form">

                <div>

                    <label for="item-type">
                        Item Type
                    </label>

                    <select id="item-type" required>

                        <option value="lost">
                            Lost
                        </option>

                        <option value="found">
                            Found
                        </option>

                    </select>

                </div>


                <div>

                    <label for="item-name">
                        Item Name
                    </label>

                    <input
                        type="text"
                        id="item-name"
                        placeholder="Enter item name"
                        required
                    >

                </div>


                <div>

                    <label for="category">
                        Category
                    </label>

                    <select id="category" required>

                        <option value="electronics">
                            Electronics
                        </option>

                        <option value="bags">
                            Bags
                        </option>

                        <option value="documents">
                            Documents / ID Cards
                        </option>

                        <option value="stationery">
                            Stationery
                        </option>

                        <option value="clothing">
                            Clothing
                        </option>

                        <option value="accessories">
                            Accessories
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <div>

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        placeholder="Describe the item"
                        required
                    ></textarea>

                </div>


                <div>

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Where was it lost/found?"
                        required
                    >

                </div>


                <div>

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <div>

                    

                    
<label for="contact">Contact Email or Phone Number</label>

<input
    type="text"
    id="contact"
    name="contact"
    placeholder="Enter your email or phone number"
    required
    minlength="5"
>


                </div>


                <button type="submit">
                    Submit Report
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 College Lost & Found</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
